[project]
name = "adhook"
version = "0.1.0"
description = "Create Meta ad hooks (image -> Veo video -> poster overlay) and merge them with body videos"
requires-python = ">=3.12"
dependencies = [
  "google-genai>=1.0",
  "openai>=1.60",
  "faster-whisper>=1.1",
  "mcp>=1.2,<2",
  "pyyaml>=6",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["adhook*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
